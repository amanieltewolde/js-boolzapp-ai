<!doctype html>
<html lang="en">
<head>

  <title>Boolzapp AI</title>
  <link rel="icon" type="image/ico" href="img/favicon.ico" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/app.css" />
  <!-- Script JS -->
  <script src="./js/config.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>

<body>
